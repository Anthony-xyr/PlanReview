name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Package application
      run: npm run dist:win

    - name: Verify update files
      run: node scripts/verify-update-assets.mjs

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PlanReview-Windows
        path: |
          dist/*.exe
          dist/latest.yml
          dist/*.blockmap
        if-no-files-found: error
        retention-days: 30

  build-macos:
    # macos-15 是 Apple Silicon（arm64），macos-15-intel 是 Intel（x64），两个都出
    # （macos-13 已被 GitHub 下线，见 https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/）
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Package application
      run: npm run dist:mac

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PlanReview-macOS-${{ matrix.runner }}
        path: |
          dist/*.dmg
          dist/latest-mac.yml
          dist/*.blockmap
        if-no-files-found: error
        retention-days: 30

  release:
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    # Wait for macOS packaging to collect any successful builds. Only Windows is required.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install release verification dependencies
      run: npm ci --ignore-scripts

    - name: Download required Windows installer
      uses: actions/download-artifact@v4
      with:
        name: PlanReview-Windows
        path: dist

    - name: Download any available Mac installers
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        path: dist/macos-artifacts
        pattern: PlanReview-macOS-*

    - name: Verify Windows update files and collect any Mac artifacts
      run: node scripts/verify-update-assets.mjs --prepare-release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: false
        files: |
          dist/*.exe
          dist/*.dmg
          dist/latest.yml
          dist/latest-mac.yml
          dist/*.blockmap
        # 说明写在 docs/releases/<tag>.md（UTF-8，中英双语）
        name: ${{ github.ref_name }}
        body_path: docs/releases/${{ github.ref_name }}.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
