name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Package application
      run: npm run dist:win

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PlanReview-Windows
        path: dist/*.exe
        retention-days: 30

  build-macos:
    # macos-15 是 Apple Silicon（arm64），macos-15-intel 是 Intel（x64），两个都出
    # （macos-13 已被 GitHub 下线，见 https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/）
    strategy:
      matrix:
        runner: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Package application
      run: npm run dist:mac

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PlanReview-macOS-${{ matrix.runner }}
        path: dist/*.dmg
        retention-days: 30

  release:
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: PlanReview-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.exe
          dist/*.dmg
        # 说明写在 docs/releases/<tag>.md（UTF-8，中英双语）
        name: ${{ github.ref_name }}
        body_path: docs/releases/${{ github.ref_name }}.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
