name: ✨ Feature Request / 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议!请详细描述你希望的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 这个功能解决什么问题?或者为什么需要它?
      placeholder: 我在使用时遇到了...，希望能有...功能
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作?
      placeholder: 我希望能够...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过其他替代方案吗?
      placeholder: 也可以...

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你有多重要?
      options:
        - 很重要 - 没有它我无法有效使用
        - 中等 - 会显著改善体验
        - 较低 - 锦上添花
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与开发
      description: 你愿意帮助实现这个功能吗?
      options:
        - label: 我愿意提交 Pull Request 来实现这个功能
        - label: 我可以帮助测试这个功能

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息、截图或参考
