name: 🐛 Bug Report / Bug 报告
description: 报告一个 Bug 帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 Bug 报告!

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 Bug
      placeholder: 例如: 当我点击"开始计时"按钮时...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题?
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么?
      placeholder: 应该开始计时并显示计时器
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么?
      placeholder: 按钮没有响应,或者报错了
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果适用,添加截图帮助解释问题
      placeholder: 拖拽图片到这里

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 你使用的 PlanReview 版本
      placeholder: 例如: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他任何相关信息
      placeholder: 例如: 是否使用了 AI 功能、数据库大小等
