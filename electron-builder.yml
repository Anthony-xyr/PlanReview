# Windows / macOS 安装包配置。产物在 dist/ 下
appId: com.planreview.app
productName: 计划与复盘
executableName: PlanReview
copyright: 个人自用

directories:
  output: dist
  buildResources: resources

# 只打包运行需要的东西：构建产物、运行时依赖、图标
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  - '!**/{test,tests,__tests__,docs,doc,example,examples}/**'
  - '!**/*.{md,markdown,ts,tsx,mts,cc,hh,inc,h,c,cpp}'
  - '!**/CMakeLists.txt'
  # rolldown 的 Windows 原生绑定只是构建工具的可选保险，不能进安装包（21MB）
  - '!node_modules/@rolldown/binding-win32-x64-msvc/**'

# 图标要在 asar 外面，托盘和系统通知才能读到；koffi 的原生模块也必须在外面才能加载
asarUnpack:
  - resources/**
  - node_modules/@koromix/koffi-win32-x64/**
  - node_modules/@koromix/koffi-darwin-arm64/**
  - node_modules/@koromix/koffi-darwin-x64/**
  - node_modules/koffi/**

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: PlanReview-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 计划与复盘
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # 卸载时保留数据库（在 %APPDATA%\plan-review 下，主进程里固定了这个目录），重装后数据还在
  deleteAppDataOnUninstall: false

mac:
  # 在哪种 Mac 上构建就产出哪种架构：Apple Silicon → arm64，Intel → x64。
  # 要出通用的 universal 包，需要两套 koffi 预编译模块，暂时不做。
  target:
    - target: dmg
  icon: resources/icon.icns
  category: public.app-category.productivity
  artifactName: PlanReview-${version}-${arch}.${ext}
  darkModeSupport: true
  # 没有 Developer ID 证书：跳过签名与公证。首次打开需要右键 →「打开」，或执行
  # xattr -dr com.apple.quarantine /Applications/计划与复盘.app
  identity: null
  notarize: false
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: 个人自用

dmg:
  artifactName: PlanReview-${version}-${arch}.${ext}

# 只生成更新配置与清单；npm 打包命令用 --publish never，发布由工作流负责。
publish:
  provider: github
  owner: Anthony-xyr
  repo: PlanReview
  releaseType: release

# 没有代码签名证书，跳过签名（Windows 上仍会生成未签名的安装包）
forceCodeSigning: false
